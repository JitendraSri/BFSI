<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <link rel="icon" type="image/svg+xml" href="/static/images/logo.svg">
  <title>Fraud Alerts | BFSI Intelligence</title>
  <link rel="stylesheet" href="/static/css/styles.css?v=3">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    .severity-bar {
      display: flex; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 1.25rem;
    }
    .severity-pill {
      padding: 4px 12px; border-radius: 20px; font-size: 0.78rem; font-weight: 600; cursor: pointer; transition: 0.2s;
    }
    .sev-critical { background: rgba(192,0,0,0.25); color:#ff4444; border:1px solid #ff4444; }
    .sev-high     { background: rgba(231,76,60,0.2); color:#e74c3c; border:1px solid #e74c3c; }
    .sev-medium   { background: rgba(243,156,18,0.2); color:#f39c12; border:1px solid #f39c12; }
    .sev-low      { background: rgba(149,165,166,0.2); color:#95a5a6; border:1px solid #95a5a6; }

    .alert-card {
      border-left: 4px solid #e74c3c;
      margin-bottom: 1rem;
      padding: 1.5rem;
      border-radius: 12px;
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 1rem;
    }
    .alert-card.sev-critical { background: rgba(192,0,0,0.12); border-color: #ff4444; }
    .alert-card.sev-high     { background: rgba(231,76,60,0.1); border-color: #e74c3c; }
    .alert-card.sev-medium   { background: rgba(243,156,18,0.1); border-color: #f39c12; }
    .alert-card.sev-low      { background: rgba(149,165,166,0.1); border-color: #95a5a6; }

    .alert-info h3 { margin: 0 0 0.5rem 0; color: #ff7675; }
    .alert-meta { color: var(--text-muted); font-size: 0.9rem; line-height: 1.6; }

    .risk-badge {
      color: white; padding: 3px 9px; border-radius: 20px;
      font-size: 0.75rem; text-transform: uppercase; font-weight: 700;
    }
    .badge-critical { background: #cc0000; }
    .badge-high     { background: #e74c3c; }
    .badge-medium   { background: #e67e22; }
    .badge-low      { background: #7f8c8d; }

    .ai-result {
      margin-top: 1rem; background: rgba(0,0,0,0.3); padding: 1rem;
      border-radius: 12px; display: none; border: 1px solid var(--primary);
    }
    .alerts-skeleton { display: flex; flex-direction: column; gap: 1rem; }
    .alerts-skeleton .skeleton-card { height: 88px; border-radius: 12px; }
  </style>
</head>

<body>
  <script src="/static/js/navbar.js?v=7"></script>

  <div class="container">
    <nav class="breadcrumb"><a href="/dashboard">Dashboard</a><span>›</span>Fraud Alerts</nav>
    <h1>Fraud Alerts & Risky Transactions</h1>
    <p>Real-time alerts generated by the detection engine. Use AI to investigate further.</p>

    <div class="severity-bar">
      <span class="severity-pill sev-critical">🔴 Critical</span>
      <span class="severity-pill sev-high">🟠 High</span>
      <span class="severity-pill sev-medium">🟡 Medium</span>
      <span class="severity-pill sev-low">⚪ Low</span>
    </div>

    <div id="alertsList" class="mt-2">
      <div class="alerts-skeleton">
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
        <div class="skeleton skeleton-card"></div>
      </div>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', loadAlerts);

    async function loadAlerts() {
      const token = localStorage.getItem('token');
      if (!token) return;

      try {
        const API_BASE = (window.location.protocol === 'http:' || window.location.protocol === 'https:') ? '' : 'http://127.0.0.1:5000';
        const res = await fetch(API_BASE + '/api/alerts', {
          headers: { 'Authorization': 'Bearer ' + token }
        });
        const alerts = await res.json();

        const container = document.getElementById('alertsList');
        if (alerts.length === 0) {
          container.innerHTML = '<p>No high-risk transactions detected yet.</p>';
          return;
        }

        function getSeverity(amount) {
          if (amount >= 20000) return { label: 'Critical', cls: 'sev-critical', badge: 'badge-critical' };
          if (amount >= 10000) return { label: 'High',     cls: 'sev-high',     badge: 'badge-high'     };
          if (amount >= 5000)  return { label: 'Medium',   cls: 'sev-medium',   badge: 'badge-medium'   };
          return                        { label: 'Low',      cls: 'sev-low',      badge: 'badge-low'      };
        }

        container.innerHTML = alerts.map(a => {
          const sev = getSeverity(a.transaction_amount || 0);
          return `
            <div class="alert-card glass ${sev.cls}">
                <div class="alert-info" style="text-align: left; flex:1;">
                    <h3><span class="risk-badge ${sev.badge}">${sev.label}</span> Transaction #${a.transaction_id}</h3>
                    <div class="alert-meta">
                        Amount: <strong>₹${(a.transaction_amount || 0).toLocaleString()}</strong>
                        &nbsp;|&nbsp; Channel: ${a.channel || '—'}
                        &nbsp;|&nbsp; Customer: ${a.customer_id || '—'}
                        <br>Time: ${a.timestamp ? new Date(a.timestamp).toLocaleString() : '—'}
                    </div>
                </div>
                <div style="flex-shrink:0;">
                    <button class="btn" onclick="analyzeTransaction('${a.transaction_id}', '${a.transaction_amount}', '${a.channel}', '${a.timestamp}')">
                        ✨ Ask AI
                    </button>
                </div>
            </div>
            <div id="ai-result-${a.transaction_id}" class="ai-result text-left"></div>
          `;
        }).join('');
      } catch (err) {
        console.error(err);
        document.getElementById('alertsList').innerHTML = '<p class="error">Failed to load alerts.</p>';
      }
    }

    async function analyzeTransaction(id, amount, channel, timestamp) {
      const token = localStorage.getItem('token');
      const resultDiv = document.getElementById(`ai-result-${id}`);

      if (!resultDiv) {
        console.error('Result div not found for transaction:', id);
        return;
      }

      resultDiv.style.display = 'block';
      resultDiv.innerHTML = '<div style="text-align: center; padding: 1rem;"><i class="fas fa-spinner fa-spin"></i> Analyzing with AI...</div>';

      try {
        const API_BASE = (window.location.protocol === 'http:' || window.location.protocol === 'https:') ? '' : 'http://127.0.0.1:5000';
        const res = await fetch(API_BASE + '/api/analyze', {
          method: 'POST',
          headers: {
            'Authorization': 'Bearer ' + token,
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            amount: parseFloat(amount) || 0,
            channel: channel || 'Unknown',
            account_age: 'Unknown',
            kyc_verified: 'Unknown',
            timestamp: timestamp || new Date().toISOString()
          })
        });

        const data = await res.json();

        if (res.ok && data.analysis) {
          // Simple formatting for markdown-like text
          let formatted = data.analysis
            .replace(/\n\n/g, '</p><p>')
            .replace(/\n/g, '<br>')
            .replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>')
            .replace(/\*(.*?)\*/g, '<em>$1</em>');

          if (!formatted.includes('<p>')) {
            formatted = '<p>' + formatted + '</p>';
          }

          resultDiv.innerHTML = `<div style="background: rgba(46, 204, 113, 0.1); padding: 1rem; border-radius: 8px; margin-top: 1rem;"><strong style="color: #2ecc71;">AI Analysis:</strong><br>${formatted}</div>`;
        } else {
          resultDiv.innerHTML = `<div style="color: #f39c12; padding: 1rem;">AI analysis unavailable: ${data.error || 'Service temporarily unavailable'}</div>`;
        }
      } catch (err) {
        console.error('AI analysis error:', err);
        resultDiv.innerHTML = '<div style="color: #e74c3c; padding: 1rem;">Error contacting AI service. Please try again later.</div>';
      }
    }
  </script>
  <!-- Curved Background Animation -->
  <script src="/static/js/curved-bg.js"></script>
</body>

</html>
